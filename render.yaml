# MindSpread — Render Blueprint
# Deploy with: connect this repo in Render → New → Blueprint
#
# Service URLs (assuming default service names):
#   Backend  : https://mindspread-api.onrender.com
#   Frontend : https://mindspread-frontend.onrender.com
#
# After the first deploy, verify FRONTEND_ORIGIN and VITE_API_URL match the
# actual service URLs, then trigger a redeploy of both services.

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: mindspread-api
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts on every deploy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Render injects postgres:// — config.py normalises it to postgresql+asyncpg://
      - key: DATABASE_URL
        fromDatabase:
          name: mindspread-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mindspread-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Must match the deployed frontend URL exactly (no trailing slash).
      - key: FRONTEND_ORIGIN
        value: https://mindspread-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: MAX_UPLOAD_MB
        value: "50"
      # Set this manually in the Render dashboard — do NOT commit real values.
      - key: SENTRY_DSN
        sync: false
      # Render uses Python 3.12 when this env var is set
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Redis Key Value ───────────────────────────────────────────────────────────
  - type: redis
    name: mindspread-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []   # private — only accessible within the same Render region

  # ── Frontend static site ─────────────────────────────────────────────────────
  - type: web
    name: mindspread-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      # Must match the deployed backend URL exactly.
      - key: VITE_API_URL
        value: https://mindspread-api.onrender.com

  # ── Background worker — uncomment in Phase 2 ─────────────────────────────────
  # - type: worker
  #   name: mindspread-worker
  #   env: python
  #   region: oregon
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: arq app.worker.WorkerSettings
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: mindspread-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: mindspread-redis
  #         property: connectionString
  #     - key: PYTHON_VERSION
  #       value: "3.12.0"

databases:
  - name: mindspread-db
    databaseName: mindspread
    plan: starter
