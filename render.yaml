# MindSpread — Render Blueprint (Free tier)
# Database : Supabase  (free) — set DATABASE_URL in Render dashboard
# Redis    : Upstash   (free) — set REDIS_URL    in Render dashboard
#
# Service URLs:
#   Backend  : https://mindspread-api.onrender.com
#   Frontend : https://mindspread-frontend.onrender.com

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: mindspread-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Paste your Supabase connection string in the Render dashboard.
      # Format: postgresql://user:password@host:5432/dbname
      - key: DATABASE_URL
        sync: false
      # Paste your Upstash Redis URL in the Render dashboard.
      # Format: rediss://default:password@host:port
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://mindspread-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SENTRY_DSN
        sync: false
      # Set both to auto-create the first admin user on startup (no shell
      # access needed on the free tier). Unset both once you've logged in.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Optional — get a free key at https://openrouter.ai/keys (free Llama
      # models, no card required). Only used as a fallback when the free
      # rule-based query parser can't match a question. Leave unset to keep
      # the AI panel fully rule-based.
      - key: OPENROUTER_API_KEY
        sync: false

  # ── Frontend static site ─────────────────────────────────────────────────────
  - type: web
    name: mindspread-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_URL
        value: https://mindspread-api.onrender.com
